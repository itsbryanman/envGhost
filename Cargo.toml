[package]
name = "env-ghost"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Caller-aware secrets filesystem for Linux"
license = "Apache-2.0"
repository = "https://github.com/itsbryanman/env-ghost"
readme = "README.md"
keywords = ["fuse", "secrets", "dotenv", "security"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fuser = "0.18.0"
getrandom = "0.4.3"
glob = "0.3.4"
humantime = "2.4.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[workspace]
members = [".", "tests/harness"]
