name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 check --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo build --locked
      - run: ./target/debug/env-ghost doctor || true
      - id: fuse
        run: .github/scripts/fuse-probe.sh ./target/debug/env-ghost >> "$GITHUB_OUTPUT"
      - name: cargo test
        env:
          ENV_GHOST_SKIP_FUSE_TESTS: ${{ steps.fuse.outputs.available == 'yes' && '0' || '1' }}
        run: cargo test --workspace --locked

  harness:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo build --locked --release --workspace
      - id: fuse
        run: .github/scripts/fuse-probe.sh ./target/release/env-ghost >> "$GITHUB_OUTPUT"
      - name: run harness
        if: steps.fuse.outputs.available == 'yes'
        run: |
          tests/harness/run.sh target/harness.tsv
          tests/harness/render.sh target/harness.tsv > target/harness-results.md
          cat target/harness-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: no fuse
        if: steps.fuse.outputs.available != 'yes'
        run: echo "FUSE is not usable on this runner; harness not run." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fuse.outputs.available == 'yes'
        with:
          name: harness-results
          path: target/harness-results.md
